<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Eras Cup</title>
<meta name="description" content="Battle every Taylor Swift song head to head. You pick the matchups, one song is eliminated each time, until two remain for the final.">
<meta name="theme-color" content="#1c0f16">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c0f16'/%3E%3Cpath d='M16 5l2.6 7.4L26 15l-7.4 2.6L16 25l-2.6-7.4L6 15l7.4-2.6z' fill='%23e3c58a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <i data-lucide="sparkles" class="spark"></i>
      <div>
        <h1>The Eras Cup</h1>
        <div class="tagline">Every song. One champion.</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="undoBtn" type="button" aria-label="Undo" title="Undo"><i data-lucide="undo-2"></i>Undo</button>
      <button class="btn-ghost" id="resetBtn" type="button" aria-label="Reset" title="Reset"><i data-lucide="rotate-ccw"></i>Reset</button>
    </div>
  </header>


  <section class="progress" aria-label="Progress">
    <div class="progress-meta">
      <span><b class="mono" id="standingCount">0</b> songs standing</span>
      <span><b class="mono" id="outCount">0</b> eliminated</span>
    </div>
    <div class="bar"><div id="barFill"></div></div>
  </section>

  <section class="arena" id="arena">
    <div class="arena-title">
      <div class="kicker" id="kicker">Pick two songs</div>
      <h2 id="battleTitle">Battle #1</h2>
    </div>
    <div class="duel">
      <article class="card" id="cardA"></article>
      <div class="vs" id="vs">vs</div>
      <article class="card" id="cardB"></article>
    </div>
    <div class="arena-foot">
      <button class="btn-ghost" id="randomBtn" type="button"><i data-lucide="dices"></i>Random matchup</button>
    </div>
  </section>

  <section class="champion" id="champion" aria-live="polite"></section>

  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="standing" type="button">This round</button>
    <button class="tab" data-tab="out" type="button">Eliminated</button>
  </div>
  <section class="lists">
    <div class="panel on" id="panel-standing">
      <div class="panel-head"><h3 id="standingTitle">Still to battle</h3><span id="standingHint">Click a song to load it</span></div>
      <div class="filters">
        <select id="eraFilter" aria-label="Filter by era"></select>
        <input id="listSearch" type="search" placeholder="Search songs" aria-label="Search standing songs">
      </div>
      <ul class="rows" id="standingRows"></ul>
    </div>
    <div class="panel" id="panel-out">
      <div class="panel-head"><h3>Eliminated</h3><span>Newest first</span></div>
      <ul class="rows" id="outRows"></ul>
    </div>
  </section>

  <footer>A fan-made game, not affiliated with Taylor Swift<br>Built by Atharva Kadam<br><span class="visitors" id="visitors" hidden></span></footer>
</div>

<script src="songs.js"></script>
<script src="app.js"></script>
</body>
</html>
